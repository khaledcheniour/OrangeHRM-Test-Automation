[pytest]
# ===========================================================================
# pytest configuration for the OrangeHRM automation project
# ===========================================================================

# Folders where pytest looks for tests
testpaths = tests

# Only collect files / classes / functions matching these patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default command-line options applied to every run.
#   --headed            -> show the browser (remove it / use --headless for CI speed)
#   --html / --self-...  -> create an HTML report at reports/report.html
#   -v                  -> verbose output
#   --strict-markers    -> fail if an unknown marker is used (keeps markers clean)
addopts =
    -v
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure
    --output=reports/test-artifacts

# Custom markers. Register every marker here so --strict-markers is happy.
# Use them in tests like:  @pytest.mark.smoke
markers =
    smoke: a small, fast set of critical-path tests
    regression: the full regression suite
    login: tests covering the login feature
    dashboard: tests covering the dashboard and global navigation
    pim: tests covering the PIM module (employee list / add employee)
    admin: tests covering the Admin module (user management)
    recruitment: tests covering the Recruitment module (candidates)
    wip: work in progress (skeletons the interns still need to implement)
